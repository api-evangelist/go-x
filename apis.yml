aid: go-x
name: Go X
description: 'Go X is an electric micromobility sharing company that lets riders rent
  scooters, e-bikes, and cars on demand, 24/7, through a consumer mobile app. Operating
  in cities such as New Orleans, Go X builds its own connected electric vehicles and
  manages fleet access, unlocking, ride sessions, and payments entirely in-app on
  iOS and Android. It is a consumer-facing mobility service rather than a public API
  provider: it exposes no developer portal, documentation, SDKs, or documented public
  API surface (its api.goxapp.com host is the private backend for the mobile apps).'
